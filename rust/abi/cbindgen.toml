language = "C"
include_guard = "AGENTGATEWAY_ABI_H"
pragma_once = true
autogen_warning = "/* Generated by cbindgen. Do not edit manually. */"
include_version = true
after_includes = """
#define AGW_PLUGIN_ENTRYPOINT "agentgateway_plugin_entrypoint"
#define AGW_PSEUDO_HEADER_METHOD ":method"
#define AGW_PSEUDO_HEADER_SCHEME ":scheme"
#define AGW_PSEUDO_HEADER_AUTHORITY ":authority"
#define AGW_PSEUDO_HEADER_PATH ":path"
#define AGW_PSEUDO_HEADER_STATUS ":status"

struct AgwApplyResult;
struct AgwBodyChunk;
struct AgwBodyStream;
struct AgwCelExpression;
struct AgwCelValue;
struct AgwError;
struct AgwHeader;
struct AgwHeaderIterator;
struct AgwHostVTable;
struct AgwHttpRequest;
struct AgwHttpResponse;
struct AgwOwnedBytes;
struct AgwPluginInstance;
struct AgwRawWaker;
struct AgwRequest;
struct AgwResponse;
"""
usize_is_size_t = true
style = "both"
tab_width = 4
documentation = true
documentation_style = "c"

[parse]
parse_deps = false

[export]
item_types = ["constants", "globals", "enums", "structs", "unions", "typedefs", "opaque", "functions"]
renaming_overrides_prefixing = true

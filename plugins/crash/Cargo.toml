[package]
name = "agw-plugin-crash"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
agentgateway-sdk = { path = "../../rust/sdk" }
http = "1.4"
serde_json = "1.0"

[dev-dependencies]
agentgateway-sdk = { path = "../../rust/sdk", features = ["testing"] }
futures-executor = "0.3"

[package]
name = "agw-plugin-regorus"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
agentgateway-sdk = { path = "../../rust/sdk" }
http = "1.4"
regorus = "0.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
agentgateway-sdk = { path = "../../rust/sdk", features = ["testing"] }
futures-executor = "0.3"

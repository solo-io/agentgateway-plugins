# yaml-language-server: $schema=https://agentgateway.dev/schema/config
binds:
- port: 3000
  listeners:
  - protocol: HTTP
    routes:
    - policies:
        plugins:
        - name: sdk-tour
          plugin: ./plugins/sdk-tour/target/release/libagw_plugin_sdk_tour.so
          config:
            calloutUrl: http://127.0.0.1:8080/
            cel: request.headers["user-agent"]
      backends:
      - host: 127.0.0.1:8080

[package]
name = "agw-plugin-quickjs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
agentgateway-sdk = { path = "../../rust/sdk" }
bytes = "1"
http = "1.4"
http-body-util = "0.1"
rquickjs = { version = "0.14", features = ["futures", "parallel"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
swc_common = "26"
swc_ts_fast_strip = "59"

[dev-dependencies]
agentgateway-sdk = { path = "../../rust/sdk", features = ["testing"] }
futures-executor = "0.3"

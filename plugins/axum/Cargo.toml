[package]
name = "agw-plugin-axum"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
agentgateway-sdk = { path = "../../rust/sdk" }
axum = "0.8"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }


[dev-dependencies]
agentgateway-sdk = { path = "../../rust/sdk", features = ["testing"] }
futures-executor = "0.3"
http-body-util = "0.1"

# yaml-language-server: $schema=https://agentgateway.dev/schema/config
binds:
- port: 3000
  listeners:
  - protocol: HTTP
    routes:
    - policies:
        plugins:
        - name: axum
          plugin: ./plugins/axum/target/release/libagw_plugin_axum.so
          config: {}
      backends:
      - host: 127.0.0.1:8080
